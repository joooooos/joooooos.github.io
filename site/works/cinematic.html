<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="release-version" content="2026.10">
<link rel="canonical" href="https://joooooos.github.io/site/works/cinematic.html">
<meta property="og:url" content="https://joooooos.github.io/site/works/cinematic.html">
<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影感知识库 · 东方神话史诗</title>
<meta name="description" content="电影感知识库:东方神话史诗 AIGC 视频的电影感方法论。导演法则、技术层、五叙事阶段、四维度参数、示范分镜与验收清单。">
<meta property="og:title" content="电影感知识库 · 东方神话史诗 · 郭江硕">
<meta property="og:description" content="只回答一个问题:我们应该怎么做,才能让 AI 视频的每一帧都在讲故事。">
<meta property="og:image" content="https://joooooos.github.io/site/works/assets/cinematic/key/hero.jpg">
<link rel="icon" href="../assets/icons/favicon-32.png?v=50">
<style>
:root{
  --ink:#0A0C0F; --ink-2:#12161B; --panel:#161B22;
  --line:rgba(210,220,235,.10); --line-2:rgba(210,220,235,.18);
  --bone:#EAE3D6; --bone-dim:#9BA4AF; --bone-faint:#5C646E;
  --s1:#1A3A4F; --s2:#8B1A1A; --s3:#C8860A; --s4:#B01E28; --s5:#D08A5A;
  --src-orig:#7FA88A; --src-sup:#C8860A; --src-fix:#D9645A; --src-rev:#6FA8DC;
  --accent:var(--s3);
  --max:1200px;
  --bar:34px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + 64px)}
body{margin:0;background:var(--ink);color:var(--bone);
  font-family:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;transition:background .9s ease}
.serif,h1,h2,h3,h4{font-family:"Songti SC","Noto Serif SC","STSong",serif}
h1,h2,h3,h4{font-weight:600;line-height:1.25;margin:0}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}

/* 遮幅 */
.bar{position:fixed;left:0;right:0;height:var(--bar);background:#000;z-index:80;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.bar .tick{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.28em;color:#5a5f66}
.bar .l{left:28px}.bar .r{right:28px}
@media(max-width:640px){:root{--bar:22px}.bar .tick{font-size:9px;letter-spacing:.18em}}

/* 顶栏 */
nav{position:fixed;top:var(--bar);left:0;right:0;z-index:70;backdrop-filter:blur(10px);
  background:rgba(10,12,15,.72);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:20px}
.brand{font-family:"Songti SC",serif;font-size:16px;white-space:nowrap}
.brand b{color:var(--accent);transition:color .6s}
.nav-links{display:flex;gap:4px;margin-left:auto;font-size:13px;color:var(--bone-dim);overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{text-decoration:none;padding:4px 9px;border-radius:2px;white-space:nowrap;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--bone)}
.nav-links a.on{color:var(--bone);background:rgba(255,255,255,.06)}
.tools{display:flex;gap:8px}
.btn{font:inherit;font-size:12px;color:var(--bone-dim);background:transparent;border:1px solid var(--line-2);
  border-radius:2px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--bone);border-color:var(--bone-faint)}
.btn[aria-pressed="true"]{color:var(--ink);background:var(--accent);border-color:var(--accent)}
@media(max-width:900px){.nav-links{display:none}}

/* Hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:130px 0 calc(var(--bar) + 40px);position:relative;overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;opacity:0;transition:opacity 1.6s ease, transform 14s ease-out;transform:scale(1.06)}
.hero-img.on{opacity:1;transform:scale(1)}
.hero-shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(10,12,15,.82) 0%,rgba(10,12,15,.45) 26%,rgba(10,12,15,0) 42%),
  linear-gradient(0deg,rgba(10,12,15,.85) 0%,rgba(10,12,15,0) 28%)}
.hero .wrap{max-width:none;width:100%;margin:0;padding:0 clamp(28px,5vw,84px)}
.hero-col{max-width:min(31vw,500px)}
@media(max-width:900px){.hero-col{max-width:none}}
.hero .lede{font-size:15px;max-width:none}
.home{font-size:12.5px;color:var(--bone-dim);text-decoration:none;white-space:nowrap;padding-right:14px;margin-right:2px;border-right:1px solid var(--line-2)}
.home:hover{color:var(--bone)}
.hero-t{font-size:clamp(60px,8vw,128px)!important;letter-spacing:.06em;line-height:1!important;max-width:none!important}
.hero-q{font-family:"Songti SC","Noto Serif SC",serif;font-size:clamp(20px,2.1vw,30px);margin-top:18px;color:var(--bone)}
.hero-q .q{color:var(--accent)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.cta a,.cta button{font:inherit;font-size:14px;text-decoration:none;color:var(--bone);border:1px solid var(--line-2);background:rgba(10,12,15,.4);
  padding:10px 18px;border-radius:2px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .2s,background .2s}
.cta a:hover,.cta button:hover{border-color:var(--accent)}
.cta .pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.reel{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:34px}
@media(max-width:760px){.reel{grid-template-columns:repeat(5,minmax(110px,1fr));overflow-x:auto}}
.frame{position:relative;aspect-ratio:2.39/1;background:var(--c);overflow:hidden;cursor:pointer;border:none;padding:0;font:inherit;color:inherit;text-align:left}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.frame:hover img{transform:scale(1.06)}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 60%)}
.frame span{position:absolute;left:8px;bottom:5px;z-index:1;font-size:12px;font-family:"Songti SC",serif}
.frame i{position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);z-index:1}
.reel-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--bone-faint);letter-spacing:.12em}

/* 阅读辅助 */
#prog{position:fixed;left:0;top:var(--bar);height:2px;width:0;z-index:72;background:linear-gradient(90deg,#4F86A8,#8B1A1A,#C8860A,#B01E28,#D08A5A)}
.rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:9px}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-decoration:none;font-size:11.5px;color:transparent;transition:color .2s}
.rail a i{width:7px;height:7px;border-radius:50%;border:1px solid var(--bone-faint);flex:none;transition:all .2s}
.rail a:hover,.rail a.on{color:var(--bone-dim)}
.rail a.on i{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
@media(max-width:1280px){.rail{display:none}}
.ov{position:fixed;inset:0;z-index:95;background:rgba(6,8,10,.96);display:none;overflow:auto;padding:90px 0 60px}
.ov.on{display:block}
.ov-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;margin-top:22px}
.ov-g a{display:block;background:var(--ink-2);padding:20px 22px;text-decoration:none;border-top:2px solid transparent;transition:border-color .2s}
.ov-g a:hover{border-top-color:var(--accent)}
.ov-g .i{font-family:"SF Mono",monospace;font-size:12px;color:var(--bone-faint)}
.ov-g h4{font-size:19px;margin:4px 0 8px}
.ov-g p{margin:0;font-size:13px;color:var(--bone-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.totop{position:fixed;right:22px;bottom:calc(var(--bar) + 18px);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.totop.on{opacity:1;pointer-events:auto}
body.present .totop{display:none}

/* 可折叠模块 */
details.blk{border:none;padding:0;margin-top:26px}
details.blk>summary{list-style:none;cursor:pointer;color:var(--bone);display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::before{content:"▸";color:var(--accent);font-size:12px;transition:transform .2s;display:inline-block}
details.blk[open]>summary::before{transform:rotate(90deg)}
details.blk>summary:hover{color:var(--accent)}
details.blk>summary .cnt{margin-left:auto;font-family:"PingFang SC",sans-serif;font-size:11.5px;color:var(--bone-faint)}
details.blk[open]>summary{border-bottom-color:transparent}
.mtoc{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 4px;padding:14px 16px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.mtoc b{font-weight:400;font-size:11.5px;letter-spacing:.2em;color:var(--bone-faint);margin-right:6px;align-self:center}
.mtoc button{font:inherit;font-size:12.5px;color:var(--bone-dim);background:transparent;border:1px solid var(--line);border-radius:2px;padding:3px 9px;cursor:pointer}
.mtoc button:hover{color:var(--bone);border-color:var(--c,var(--accent))}
.mtoc .all{margin-left:auto;color:var(--accent)}
.key-banner{width:100%;aspect-ratio:2.39/1;object-fit:cover;display:block;margin:22px 0 4px}
.stage-key{width:100%;aspect-ratio:2.39/1;object-fit:cover;display:block}
.wall.clip .fig:nth-child(n+7){display:none}
.gal .more{margin-top:12px}
.hero-bg{position:absolute;inset:0;opacity:.6;background:
  radial-gradient(120% 80% at 15% 10%,rgba(26,58,79,.55),transparent 55%),
  radial-gradient(90% 70% at 88% 90%,rgba(200,134,10,.22),transparent 60%),
  radial-gradient(80% 90% at 60% 40%,rgba(139,26,26,.18),transparent 65%)}
.hero .wrap{position:relative}
.eyebrow{color:var(--bone-faint);font-size:13px;letter-spacing:.3em;margin-bottom:26px}
.hero h1{font-size:clamp(30px,5.2vw,64px);max-width:17ch}
.hero h1 .q{color:var(--accent);transition:color .6s}
.lede{margin-top:28px;max-width:46ch;color:var(--bone-dim);font-size:clamp(15px,1.7vw,18px)}
.verdict{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.verdict .v{padding:9px 16px;border:1px solid var(--line-2);border-radius:2px;color:var(--bone-dim)}
.verdict .v b{color:var(--bone)}
.hero-arc{display:grid;grid-template-columns:repeat(5,1fr);height:6px;margin-top:56px;max-width:560px}
.hint{margin-top:22px;color:var(--bone-faint);font-size:12px;letter-spacing:.12em}
.hint kbd{font-family:inherit;border:1px solid var(--line-2);border-radius:2px;padding:0 6px;margin:0 2px}

/* section */
section{padding:92px 0;border-top:1px solid var(--line);min-height:40vh}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:12px}
.sec-idx{font-family:"SF Mono",monospace;font-size:13px;color:var(--bone-faint);letter-spacing:.1em}
.sec-head h2{font-size:clamp(24px,3.3vw,40px)}
.sec-sub{color:var(--bone-dim);max-width:62ch;margin:0 0 40px;font-size:15.5px}
h3.sub{font-size:20px;margin:44px 0 6px}

/* 模块 */
.blk{margin-top:30px;transition:opacity .3s}
.blk-h{font-family:"Songti SC",serif;font-size:17px;margin-bottom:4px}
.blk-n{font-size:13px;color:var(--bone-faint);margin:2px 0 10px;max-width:80ch}
.blk p.t{margin:6px 0 0;color:var(--bone-dim);font-size:15px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--bone-faint);font-weight:400;font-size:12px;letter-spacing:.05em;white-space:nowrap}
td{color:var(--bone)}
td:first-child{font-family:"Songti SC",serif;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.015)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
ul.lst{margin:8px 0 0;padding-left:20px;color:var(--bone-dim);font-size:14.5px}
ul.lst li{margin-bottom:6px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin-top:10px}
.flow .st{border:1px solid var(--line-2);padding:10px 14px;font-size:13.5px;background:var(--ink-2);display:flex;align-items:center}
.flow .ar{display:flex;align-items:center;padding:0 8px;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:10px}
.card{border:1px solid var(--line);padding:18px 20px;background:var(--ink-2)}
.card h4{font-size:16px;margin-bottom:8px}
.card p{margin:0;color:var(--bone-dim);font-size:14px}
pre.code{background:#05070a;border:1px solid var(--line);padding:14px 16px;overflow-x:auto;font-size:12.5px;color:#cfd6df;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}

/* 是什么 */
.verdict-box{padding:24px 28px;border-left:2px solid var(--accent);background:rgba(200,134,10,.06);
  font-family:"Songti SC",serif;font-size:clamp(17px,2vw,21px);transition:border-color .6s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.def-card{border:1px solid var(--line);padding:26px 28px}
.def-card .k{font-family:"Songti SC",serif;font-size:20px}
.def-card .role{color:var(--bone);font-size:14.5px;margin:8px 0}
.def-card p{margin:0;color:var(--bone-dim);font-size:14px}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:22px}
@media(max-width:900px){.quad{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.quad{grid-template-columns:1fr}}
.qd{padding:22px;background:var(--ink-2);border-top:3px solid var(--c);cursor:pointer;transition:background .2s}
.qd:hover{background:var(--panel)}
.qd .n{font-family:"Songti SC",serif;font-size:22px}
.qd .o{font-family:"Songti SC",serif;color:var(--bone);font-size:14.5px;margin:8px 0}
.qd p{margin:0;color:var(--bone-dim);font-size:13px}

/* 技术层 */
.tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.tech-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.tech-grid{grid-template-columns:1fr}}
.tech{border:1px solid var(--line);padding:22px;background:var(--ink-2)}
.tech .op{font-family:"Songti SC",serif;font-size:17px;margin-bottom:10px}
.tech .how{color:var(--bone-faint);font-size:12.5px;margin-bottom:12px}
.tech .ef{color:var(--bone-dim);font-size:13.5px}

/* 五阶段 */
.arc-track{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:6px}
.arc-seg{position:relative;height:96px;cursor:pointer;border:none;padding:0;display:flex;flex-direction:column;
  justify-content:flex-end;color:#fff;text-align:left;overflow:hidden;transition:filter .3s,transform .3s}
.arc-seg:hover{filter:brightness(1.15)}
.arc-seg .num{position:absolute;top:10px;left:12px;font-family:"Songti SC",serif;font-size:15px;opacity:.85}
.arc-seg .nm{position:relative;z-index:1;padding:0 12px 12px;font-family:"Songti SC",serif;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.arc-seg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5))}
.arc-seg[aria-selected="true"]{transform:translateY(-4px);box-shadow:0 0 0 2px var(--bone) inset}
.arc-sig{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:10px 0 30px;font-size:12px;color:var(--bone-faint)}
.arc-sig div{padding:6px 10px;border-top:1px dashed var(--line-2)}
.arc-sig b{color:var(--bone-dim);font-weight:400}
.stage{border:1px solid var(--line-2);background:var(--ink-2)}
.stage-top{padding:24px 28px;display:flex;gap:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:flex-start}
.stage-swatch{width:54px;height:54px;border-radius:2px;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.stage-title .num{color:var(--bone-faint);font-size:13px}
.stage-title h3{font-size:28px;margin-top:2px}
.stage-title .feat{color:var(--bone-dim);font-size:14px;margin-top:8px}
.stage-fore{margin-left:auto;max-width:28ch;text-align:right}
.stage-fore .lb{font-size:11px;letter-spacing:.2em;color:var(--bone-faint);display:block;margin-bottom:4px}
.stage-fore .tx{font-family:"Songti SC",serif;font-size:15.5px;line-height:1.5;color:var(--accent)}
.dims{display:grid;grid-template-columns:repeat(5,1fr)}
@media(max-width:1000px){.dims{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.dims{grid-template-columns:1fr}}
.dim{padding:20px 20px 24px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.dim:last-child{border-right:none}
.dim .dh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dim .dot{width:8px;height:8px;border-radius:50%}
.dim .nm{font-family:"Songti SC",serif;font-size:17px}
.dim .en{font-size:11px;color:var(--bone-faint)}
.dim dt{font-size:11.5px;color:var(--bone-faint);margin-top:10px}
.dim dd{margin:2px 0 0;font-size:13.5px}
.stage-foot{padding:16px 28px;border-top:1px solid var(--line);font-size:13.5px;color:var(--bone-dim)}
.stage-foot b{color:var(--bone);font-weight:400;font-family:"Songti SC",serif}

/* 四维度 tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.tab{font:inherit;background:transparent;border:none;color:var(--bone-dim);padding:12px 22px;cursor:pointer;
  font-family:"Songti SC",serif;font-size:18px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab small{font-family:"PingFang SC",sans-serif;font-size:11px;color:var(--bone-faint);margin-left:6px}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--c)}
.pane{display:none;padding-top:26px}
.pane.on{display:block}
.pane-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
@media(max-width:820px){.pane-hero{grid-template-columns:1fr}}
.pane-hero .one{font-family:"Songti SC",serif;font-size:clamp(20px,2.4vw,28px);border-left:3px solid var(--c);padding-left:18px}
.pane-hero .def{color:var(--bone-dim);font-size:14.5px;margin-top:14px}
.kv{border:1px solid var(--line);background:var(--ink-2)}
.kv div{padding:14px 18px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:none}
.kv .k{font-size:11.5px;letter-spacing:.12em;color:var(--c);display:block;margin-bottom:4px}
.kv .v{font-size:14px;color:var(--bone-dim)}
.between{margin-top:46px;padding-top:6px;border-top:1px dashed var(--line-2)}
.between>.lb{font-size:12px;letter-spacing:.2em;color:var(--bone-faint);margin-top:18px}

/* 矩阵 */
.matrix{min-width:900px}
.matrix td:first-child{color:var(--bone)}
.arcline{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:22px}
@media(max-width:820px){.arcline{grid-template-columns:1fr 1fr}}
.arcline .cell{padding:14px;border:1px solid var(--line);font-size:13px;color:var(--bone-dim)}
.arcline .cell b{display:block;color:var(--bone);font-family:"Songti SC",serif;margin-bottom:6px}

/* Prompt */
.layers{display:grid;gap:10px;margin-top:8px}
.layer{border:1px solid var(--line);padding:16px 20px;background:var(--ink-2)}
.layer .l{font-size:12px;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.layer .c{font-size:13.5px;color:var(--bone-dim)}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.nodes{grid-template-columns:1fr}}

/* 验收 */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:820px){.checks{grid-template-columns:1fr}}
.ck{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--bone-dim);align-items:flex-start}
.ck input{margin-top:5px;accent-color:var(--s3)}
.ck .d{font-size:11px;color:var(--bone-faint);border:1px solid var(--line-2);padding:0 6px;border-radius:2px;white-space:nowrap;margin-top:3px}
.ck.done{color:var(--bone-faint);text-decoration:line-through}
.progress{font-size:12px;color:var(--bone-faint);margin-top:6px}

/* 案例 */
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;margin-top:16px}
@media(max-width:820px){.timeline{grid-template-columns:1fr 1fr}}
.tl{background:var(--ink-2);padding:18px;border-top:3px solid var(--c)}
.tl .tm{font-family:"SF Mono",monospace;font-size:12px;color:var(--bone-faint)}
.tl h4{font-size:16px;margin:4px 0 8px}
.tl p{margin:0 0 10px;font-size:13.5px;color:var(--bone-dim)}
.tl .pt{font-size:12px;color:var(--bone)}
details{margin-top:18px;border:1px solid var(--line);padding:12px 16px}
summary{cursor:pointer;color:var(--bone-dim);font-size:14px}
details p{color:var(--bone-dim);font-size:13.5px}

/* 术语 */
.search{width:100%;max-width:360px;font:inherit;font-size:14px;color:var(--bone);background:var(--ink-2);
  border:1px solid var(--line-2);border-radius:2px;padding:8px 12px;margin-bottom:14px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px}
.gl{padding:14px 16px;background:var(--ink-2)}
.gl b{font-family:"Songti SC",serif;font-weight:600;display:block;margin-bottom:4px}
.gl span{font-size:13px;color:var(--bone-dim)}

/* 图库 */
.gal{margin-top:34px}
.gal-h{font-family:"Songti SC",serif;font-size:17px;margin-bottom:4px}
.gal-q{font-size:13px;color:var(--bone-faint);margin:2px 0 10px;border-left:2px solid var(--line-2);padding-left:10px}
.gal-c{font-size:13.5px;color:var(--bone-dim);margin:12px 0 0;padding:12px 16px;background:rgba(111,168,220,.06);border-left:2px solid var(--src-rev)}
.gal-c b{color:var(--src-rev);font-weight:400;margin-right:6px}
.fig{margin:0;background:var(--ink-2);border:1px solid var(--line);display:flex;flex-direction:column}
.fig .im{position:relative;background:#000;cursor:zoom-in;overflow:hidden}
.fig img{display:block;width:100%;height:auto;transition:transform .5s}
.fig .im:hover img{transform:scale(1.03)}
.fig figcaption{padding:10px 12px 12px;font-size:12.5px;color:var(--bone-dim);flex:1}
.fig .cap{color:var(--bone);font-size:13px;margin-bottom:6px;display:block}
.fig .cm{display:block;margin-top:6px;color:var(--bone-dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:"SF Mono",monospace;font-size:10.5px;color:var(--bone-faint);border:1px solid var(--line);padding:0 5px;border-radius:2px;white-space:nowrap}
.chip.wide{color:#9fd3a8;border-color:rgba(159,211,168,.35)}
.chip.narrow{color:#e5978f;border-color:rgba(229,151,143,.35)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.pairs{display:grid;gap:16px;margin-top:10px}
.pair{border:1px solid var(--line);background:rgba(255,255,255,.01);padding:14px}
.pair-h{font-family:"Songti SC",serif;font-size:15px;margin-bottom:10px}
.pair-g{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pair-g .ar{color:var(--accent);font-size:20px}
@media(max-width:640px){.pair-g{grid-template-columns:1fr}.pair-g .ar{display:none}}
.pair .tag{font-size:11px;letter-spacing:.12em;color:var(--bone-faint);margin-bottom:4px}
.pair .cm{font-size:13px;color:var(--bone-dim);margin-top:10px}
.lb-wrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.lb-wrap.on{display:flex}
.lb-wrap img{max-width:94vw;max-height:72vh;object-fit:contain;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.lb-meta{max-width:900px;margin-top:16px;text-align:center;color:var(--bone-dim);font-size:14px}
.lb-meta .cap{color:var(--bone);font-family:"Songti SC",serif;font-size:17px;display:block;margin-bottom:8px}
.lb-meta .chips{justify-content:center;margin:8px 0}
.lb-x{position:absolute;top:16px;right:22px;color:var(--bone-dim);font-size:13px;cursor:pointer}

/* 导演法则 */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2px;margin-top:8px}
.rule{background:var(--ink-2);padding:24px 26px 26px}
.rule .no{font-family:"SF Mono",monospace;font-size:12px;color:var(--accent)}
.rule h4{font-size:21px;margin:6px 0 10px}
.rule p{margin:0;color:var(--bone-dim);font-size:14.5px;line-height:1.85}
.rule .do{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--bone)}
.rule .do b{color:var(--accent);font-weight:400;margin-right:6px}
/* 阶段扩展 */
.dims.ext{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.dims.ext{grid-template-columns:1fr 1fr}}
.stage-more{padding:18px 28px 6px;border-top:1px solid var(--line)}
.stage-more .lb{font-size:11px;letter-spacing:.2em;color:var(--bone-faint);margin-bottom:8px}
.stage-more .code{margin:0 0 14px}
.case-h{font-family:"Songti SC",serif;font-size:24px;margin:46px 0 6px}
.case-h:first-of-type{margin-top:10px}
.case-d{color:var(--bone-dim);font-size:14.5px;margin:0 0 6px}
.shots td:first-child{font-family:"SF Mono",monospace;color:var(--accent);white-space:nowrap}
.shots td:nth-child(2){white-space:nowrap;font-family:"SF Mono",monospace;font-size:12px}
footer{padding:60px 0 calc(var(--bar) + 60px);border-top:1px solid var(--line);color:var(--bone-faint);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}

/* 讲解模式 */
body.present section{min-height:calc(100vh - var(--bar)*2);padding:120px 0 80px}
body.present .sec-head h2{font-size:clamp(30px,4.2vw,52px)}
body.present .sec-sub{font-size:18px}
body.present table{font-size:15px}
.pager{position:fixed;right:24px;bottom:calc(var(--bar) + 18px);z-index:75;display:none;gap:6px;align-items:center;
  font-size:12px;color:var(--bone-faint);background:rgba(10,12,15,.8);border:1px solid var(--line);padding:6px 10px;border-radius:2px}
body.present .pager{display:flex}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{.bar,nav,.pager{display:none}.reveal{opacity:1;transform:none}body{background:#fff;color:#111}}

<script>
const DB = JSON.parse(document.getElementById('db').textContent);
const MET = JSON.parse(document.getElementById('metrics').textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const isHex = s => typeof s === 'string' && /^#[0-9A-Fa-f]{6}$/.test(s.trim());
const DIM_C = Object.fromEntries([...DB.四维度, ...DB.辅助维度].map(d => [d.id, d.主题色]));
const STAGE_C = DB.五叙事阶段.阶段.map(s => s.主题色);

/* ---------- 通用组件 ---------- */
function cell(v) {
  if (isHex(v)) return `<span class="sw" style="background:${v}"></span><span class="mono">${esc(v)}</span>`;
  return esc(v).replace(/(#[0-9A-Fa-f]{6})/g, '<span class="sw" style="background:$1"></span>$1');
}
function table(cols, rows, cls = '') {
  return `<div class="tbl"><table class="${cls}"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function objTable(arr, keys, heads) {
  return table(heads || keys, arr.map(o => keys.map(k => o[k])));
}
function flow(steps) {
  return `<div class="flow">${steps.map((s, i) => `${i ? '<span class="ar">→</span>' : ''}<span class="st">${esc(s)}</span>`).join('')}</div>`;
}
function block(b) {
  let body = '';
  switch (b.类型) {
    case 'text': body = `<p class="t">${esc(b.内容)}</p>`; break;
    case 'list': body = `<ul class="lst">${b.条目.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; break;
    case 'table': body = table(b.列, b.行); break;
    case 'flow': body = flow(b.步骤); break;
    case 'code': body = `<pre class="code">${esc(b.内容)}</pre>`; break;
    case 'cards': body = `<div class="cards">${b.卡片.map(c => `<div class="card"><h4>${esc(c.标题)}</h4><p>${esc(c.内容)}</p></div>`).join('')}</div>`; break;
  }
  const n = b.类型 === 'table' ? `${b.行.length} 行` : b.类型 === 'list' ? `${b.条目.length} 条` : b.类型 === 'flow' ? `${b.步骤.length} 步` : b.类型 === 'cards' ? `${b.卡片.length} 张` : '';
  return `<details class="blk" open data-t="${esc(b.标题)}">
    <summary class="blk-h">${esc(b.标题)}${n ? `<span class="cnt">${n}</span>` : ''}</summary>
    ${b.备注 ? `<div class="blk-n">${esc(b.备注)}</div>` : ''}${body}</details>`;
}
function section(id, idx, title, sub, inner) {
  return `<section id="${id}" data-title="${esc(title)}"><div class="wrap reveal">
    <div class="sec-head"><span class="sec-idx">${idx}</span><h2>${esc(title)}</h2></div>
    ${sub ? `<p class="sec-sub">${sub}</p>` : ''}${inner}</div></section>`;
}


/* ---------- 图库 ---------- */
const FIGS = [];
function arLabel(a) {
  if (a < 1.82) return ['16:9', 'narrow'];
  if (a < 1.92) return ['1.85:1', ''];
  if (a < 2.15) return ['2.00:1', 'wide'];
  if (a < 2.5) return ['2.39:1', 'wide'];
  return [a.toFixed(2) + ':1', 'wide'];
}
function chips(id) {
  const m = MET[id]; if (!m) return '';
  const [ar, cls] = arLabel(m.画幅);
  const c = [`<span class="chip ${cls}">${ar}</span>`, `<span class="chip">跨度 ${m.动态范围档.toFixed(1)} 档</span>`,
    `<span class="chip">亮 ${m.平均亮度.toFixed(2)}</span>`, `<span class="chip">饱 ${m.饱和度.toFixed(2)}</span>`,
    `<span class="chip">暖 ${Math.round(m.暖色占比 * 100)}% · 冷 ${Math.round(m.冷色占比 * 100)}%</span>`];
  if (m.人物框占比 > 0.01) c.push(`<span class="chip">人物 ${Math.round(m.人物框占比 * 100)}%${m.人物中心x != null ? ' @x' + m.人物中心x.toFixed(2) : ''}</span>`);
  return `<div class="chips">${c.join('')}</div>`;
}
function fig(id, cap, cm) {
  const i = FIGS.push({ id, cap, cm }) - 1;
  const m = MET[id];
  return `<figure class="fig"><div class="im" data-fig="${i}"><img src="assets/cinematic/${id}.jpg" alt="${esc(cap || id)}" loading="lazy"
      ${m ? `width="${m.宽}" height="${m.高}"` : ''}></div>
    <figcaption>${cap ? `<span class="cap">${esc(cap)}</span>` : ''}${chips(id)}${cm ? `<span class="cm">${esc(cm)}</span>` : ''}</figcaption></figure>`;
}
function galGroup(g) {
  let body = '';
  if (g.类型 === 'versus') {
    const side = (s, cls) => `<div class="side ${cls}"><div class="lb">${esc(s.标签)}</div>${s.图.map(id => fig(id, '', '')).join('')}</div>`;
    body = `<div class="vs">${side(g.左, 'l')}${side(g.右, 'r')}</div>`;
  } else if (g.类型 === 'pairs') {
    body = `<div class="pairs">${g.对.map(p => `<div class="pair"><div class="pair-h">${esc(p.标题)}</div>
      <div class="pair-g"><div><div class="tag">${esc(g.前标签)}</div>${fig(p.前, p.标题 + ' · ' + g.前标签, p.点评)}</div><span class="ar">→</span>
      <div><div class="tag">${esc(g.后标签)}</div>${fig(p.后, p.标题 + ' · ' + g.后标签, p.点评)}</div></div>
      ${p.点评 ? `<div class="cm"><b style="color:var(--accent);font-weight:400">要点 · </b>${esc(p.点评)}</div>` : ''}</div>`).join('')}</div>`;
  } else {
    body = `<div class="wall${g.图.length > 6 ? ' clip' : ''}">${g.图.map(x => fig(x.id, x.说明, x.点评)).join('')}</div>
      ${g.图.length > 6 ? `<button class="btn more">展开全部 ${g.图.length} 张</button>` : ''}`;
  }
  return `<div class="gal blk"><div class="gal-h">${esc(g.标题)}</div>${body}
    ${g.点评 ? `<div class="gal-c"><b>要点</b>${esc(g.点评)}</div>` : ''}</div>`;
}
const galFor = ch => DB.图库.组.filter(g => g.章节 === ch).map(galGroup).join('');

/* ---------- Hero ---------- */
function hero() {
  const g = DB.导读, m = DB.meta;
  const S = DB.五叙事阶段.阶段;
  $('#heroWrap').innerHTML = `<div class="hero-col">
    <div class="eyebrow">${esc(m.副标题)} · ${esc(m.版本)}</div>
    <h1 class="hero-t">电影感</h1>
    <div class="hero-q">关掉声音——<span class="q">${esc(g.唯一判断标准)}</span></div>
    <p class="lede">${esc(g.一句话定义)}</p>
    <div class="cta">
      <button class="pri" id="ctaPresent">▶ 开始讲解</button>
      <a href="#rules">导演法则</a><a href="#arc">五叙事阶段</a><a href="#case">示范分镜</a><a href="#check">验收清单</a>
    </div>
    <div class="reel">${S.map((s, i) => `<button class="frame" data-stage="${i}" style="--c:${s.主题色}" title="${esc(s.名称)}">
      <img src="assets/cinematic/key/stage-${i + 1}.jpg" alt="" onerror="this.remove()"><i></i><span>${esc(s.名称.split('·')[1] || s.名称)}</span></button>`).join('')}</div>
    <div class="reel-cap"><span>情绪弧线 · 冷 → 暖 → 极端 → 温</span><span>P 讲解 · G 总览</span></div></div>`;
  const hi = $('#heroImg'), wide = innerWidth / innerHeight > 1;
  const tries = [wide ? 'assets/cinematic/key/hero.jpg' : 'assets/cinematic/key/hero-m.jpg', 'assets/cinematic/key/hero.jpg'];
  hi.onload = () => hi.classList.add('on');
  hi.onerror = () => { tries.shift(); if (tries.length) hi.src = tries[0]; else hi.remove(); };
  hi.src = tries[0];
  $('#footMeta').textContent = `${m.标题} ${m.版本} · ${m.数据来源} · ${m.整理日期}`;
}

/* ---------- 01 是什么 ---------- */
function secWhat() {
  const w = DB.是什么, g = DB.导读;
  return section('what', '01', '什么是电影感', esc(w.原文定义), `
    <div class="verdict-box">判断标准只有一个 · ${esc(w.判断标准)}</div>
    <div class="grid2">${w.两层构成.map(l => `<div class="def-card"><div class="k">${esc(l.层)}</div>
      <div class="role">${esc(l.内容)}</div><p>${esc(l.作用)}</p></div>`).join('')}</div>
    <h3 class="sub">四维度速览</h3>
    <div class="quad">${g.四维度速览.map(d => `<div class="qd" style="--c:${DIM_C[d.id]}" data-go="${d.id}">
      <div class="n">${esc(d.维度)}</div><div class="o">${esc(d.一句话)}</div><p>${esc(d.核心)}</p></div>`).join('')}</div>`);
}

/* ---------- 02 导演法则 ---------- */
function secRules() {
  const R = DB.导演法则;
  return section('rules', '02', '导演法则 · 电影感的底层逻辑', esc(R.说明), `
    <div class="rules">${R.法则.map((r, i) => `<div class="rule"><div class="no">LAW ${String(i + 1).padStart(2, '0')}</div>
      <h4>${esc(r.标题)}</h4><p>${esc(r.内容)}</p><div class="do"><b>怎么做</b>${esc(r.落地)}</div></div>`).join('')}</div>
    ${galFor('why')}
    ${block({ 标题: '样片数据怎么看', 类型: 'table', 备注: DB.图库.说明, 列: ['指标', '含义'], 行: DB.图库.测量说明 })}`);
}

/* ---------- 03 技术层 ---------- */
function secTech() {
  const t = DB.技术层;

function renderStage(i) {

    <img class="stage-key" src="assets/cinematic/key/stage-${i + 1}.jpg" alt="${esc(s.名称)}关键帧" onerror="this.remove()">
    <div class="stage-top">
      <div class="stage-swatch" style="background:${s.主题色}"></div>
      <div class="stage-title"><span class="num">阶段 ${s.编号} · ${esc(s.标签)}</span><h3>${esc(s.名称)}</h3>
        <div class="feat">情节:${esc(s.情节特征)}<br>画面:${esc(s.典型画面特征)}</div></div>
      <div class="stage-fore"><span class="lb">情绪预告功能</span><span class="tx">${esc(s.情绪预告功能)}</span></div>
    </div>
    <div class="dims">${cols.map(([zh, id, en]) => `<div class="dim">
      <div class="dh"><span class="dot" style="background:${zh === '运镜' ? 'var(--accent)' : DIM_C[id]}"></span><span class="nm">${zh}</span><span class="en">${en}</span></div>
      <dl>${dl(s[zh])}</dl></div>`).join('')}</div>
    <div class="dims ext">${[['声音', 'sound', 'Sound'], ['表演', 'acting', 'Performance'], ['环境特效', 'content', 'Environment & FX'], ['剪辑', 'edit', 'Editing']].map(([zh, id, en]) => `<div class="dim">
      <div class="dh"><span class="dot" style="background:${DIM_C[id]}"></span><span class="nm">${zh}</span><span class="en">${en}</span></div>
      <dl>${dl(s[zh])}</dl></div>`).join('')}</div>
    <div class="stage-more"><div class="lb">镜头清单 · 这一阶段的典型拍法</div>
      ${table(['镜', '景别 / 角度', '运镜', '时长', '画面'], s.镜头清单, 'shots')}
      <div class="lb" style="margin-top:18px">PROMPT 片段 · 直接拼进第二层声明</div><pre class="code">${esc(s.Prompt片段)}</pre></div>
    <div class="stage-foot"><b>环境升华示例 · </b>${esc(s.环境升华示例)}</div>`;
  document.documentElement.style.setProperty('--accent', s.主题色 === '#1A3A4F' ? '#4F86A8' : s.主题色);
  $('#brandStage').textContent = s.名称;
  document.body.style.background = `linear-gradient(180deg, ${s.主题色}18, var(--ink) 420px)`;
  $$('.arc-seg').forEach((b, bi) => b.setAttribute('aria-selected', bi === i));
}

/* ---------- 05 四维度 ---------- */

      <div><div class="one">${esc(d.一句话)}</div><p class="def">${esc(d.定义)}</p></div>

    ${galFor(d.id)}

function secDims() {

    <div class="tabs" role="tablist">${D.map((d, i) => `<button class="tab" role="tab" data-id="${d.id}" style="--c:${d.主题色}" aria-selected="${i === 0}">${esc(d.名称)}<small>${esc(d.英文)}</small></button>`).join('')}</div>

function openDim(id, sec = 'dims') {
  $$(`#${sec} .tab`).forEach(t => t.setAttribute('aria-selected', t.dataset.id === id));

}

/* ---------- 组装 ---------- */
hero();
$('#app').innerHTML = [secWhat(), secRules(), secTech(), secArc(), secDims(), secAux(), secMatrix(), secLine(), secPrompt(), secCase(), secCheck(), secRef(), secGloss()].join('');
renderStage(0);

const SECS = $$('main section');
$('#navLinks').innerHTML = SECS.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.dataset.title.split(' · ')[0])}</a>`).join('');

$$('.arc-seg').forEach(b => b.addEventListener('click', () => renderStage(+b.dataset.i)));

/* 长章节:前 3 个模块展开,其余折叠 + 本页目录 */
const FOLD_IN = ['#dims .pane', '#aux .pane', '#prompt .wrap', '#tech .wrap', '#line .wrap'];
FOLD_IN.forEach(sel => $$(sel).forEach(box => {
  const ds = $$(':scope > details.blk', box);
  if (ds.length < 5) return;
  ds.forEach((d, i) => { if (i >= 3) d.open = false; d.id = d.id || `m-${Math.random().toString(36).slice(2, 8)}`; });
  const toc = document.createElement('div'); toc.className = 'mtoc';
  toc.innerHTML = `<b>本页 ${ds.length} 个模块</b>${ds.map(d => `<button data-to="${d.id}">${esc(d.dataset.t)}</button>`).join('')}<button class="all">全部展开</button>`;
  ds[0].before(toc);
  toc.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('all')) { const open = b.textContent === '全部展开'; ds.forEach(d => d.open = open); b.textContent = open ? '全部收起' : '全部展开'; return; }
    const d = document.getElementById(b.dataset.to); d.open = true; d.scrollIntoView({ behavior: 'smooth' });
  });
}));
$('#btnFold').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? '全部收起' : '全部展开';
  $$('details.blk').forEach(d => d.open = on);
  $$('.mtoc .all').forEach(b => b.textContent = on ? '全部收起' : '全部展开');
});

$$('.gal .more').forEach(b => b.addEventListener('click', () => {
  const w = b.previousElementSibling, on = w.classList.toggle('clip');
  b.textContent = on ? `展开全部 ${w.children.length} 张` : '收起';
}));

/* Hero 交互 */
$('#ctaPresent').addEventListener('click', () => setPresent(true));
$$('.frame').forEach(f => f.addEventListener('click', () => { renderStage(+f.dataset.stage); $('#arc').scrollIntoView({ behavior: 'smooth' }); }));

/* 右侧章节导轨、总览、进度条、回到顶部 */
$('#rail').innerHTML = SECS.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.dataset.title.split(' · ')[0])}<i></i></a>`).join('');
$('#ovG').innerHTML = SECS.map(s => `<a href="#${s.id}"><div class="i">${esc($('.sec-idx', s).textContent)}</div><h4>${esc(s.dataset.title)}</h4>
  <p>${esc(($('.sec-sub', s) || {}).textContent || '')}</p></a>`).join('');
const ov = $('#ov');
const ovToggle = on => ov.classList.toggle('on', on ?? !ov.classList.contains('on'));
$('#btnToc').addEventListener('click', () => ovToggle());
$('#ovG').addEventListener('click', e => { if (e.target.closest('a')) ovToggle(false); });
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input,textarea')) return;
  if (e.key === 'g' || e.key === 'G') ovToggle();
  if (e.key === 'Escape' && ov.classList.contains('on')) { ovToggle(false); e.stopImmediatePropagation(); }
}, true);
$('#totop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  $('#prog').style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
  $('#totop').classList.toggle('on', scrollY > innerHeight);
}, { passive: true });
$$('.tabs .tab').forEach(t => t.addEventListener('click', () => openDim(t.dataset.id, t.closest('section').id)));
$$('.qd').forEach(q => q.addEventListener('click', () => { openDim(q.dataset.go); $('#dims').scrollIntoView(); }));

$('#glossQ').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('.gl').forEach(g => g.style.display = !q || g.textContent.toLowerCase().includes(q) ? '' : 'none');
});

const CK_KEY = 'cine-kb-checks';
const ckState = JSON.parse(localStorage.getItem(CK_KEY) || '{}');
function ckUpdate() {
  const all = $$('.ck input'), done = all.filter(x => x.checked);
  all.forEach(x => x.closest('.ck').classList.toggle('done', x.checked));
  $('#ckProg').textContent = `已完成 ${done.length} / ${all.length}`;
}
$$('.ck input').forEach(x => {
  x.checked = !!ckState[x.dataset.k];
  x.addEventListener('change', () => { ckState[x.dataset.k] = x.checked; localStorage.setItem(CK_KEY, JSON.stringify(ckState)); ckUpdate(); });
});
$('#ckReset').addEventListener('click', () => { $$('.ck input').forEach(x => x.checked = false); localStorage.removeItem(CK_KEY); for (const k in ckState) delete ckState[k]; ckUpdate(); });
ckUpdate();



/* 灯箱 */
let lbI = -1;
function lbShow(i) {
  lbI = (i + FIGS.length) % FIGS.length;
  const f = FIGS[lbI];
  $('#lbImg').src = `assets/cinematic/${f.id}.jpg`; $('#lbImg').alt = f.cap || f.id;
  $('#lbMeta').innerHTML = `${f.cap ? `<span class="cap">${esc(f.cap)}</span>` : ''}${chips(f.id)}${f.cm ? `<div>${esc(f.cm)}</div>` : ''}
    <div class="mono" style="font-size:11px;color:var(--bone-faint);margin-top:8px">${f.id} · ${lbI + 1} / ${FIGS.length}</div>`;
  $('#lightbox').classList.add('on');
}
function lbClose() { $('#lightbox').classList.remove('on'); lbI = -1; }
document.addEventListener('click', e => {
  const im = e.target.closest('[data-fig]'); if (im) { lbShow(+im.dataset.fig); return; }
  if (e.target.id === 'lightbox' || e.target.id === 'lbX') lbClose();
});
document.addEventListener('keydown', e => {
  if (lbI < 0) return;
  e.stopImmediatePropagation(); e.preventDefault();
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowRight') lbShow(lbI + 1);
  if (e.key === 'ArrowLeft') lbShow(lbI - 1);
}, true);

/* 讲解模式 */
const PAGES = [$('#top'), ...SECS];
let cur = 0;
function curIndex() {
  const y = window.scrollY + window.innerHeight * 0.35;
  let i = 0; PAGES.forEach((p, k) => { if (p.offsetTop <= y) i = k; }); return i;
}
function go(i) {
  cur = Math.max(0, Math.min(PAGES.length - 1, i));
  PAGES[cur].scrollIntoView({ behavior: 'smooth' });
}
function setPresent(on) {
  document.body.classList.toggle('present', on);
  $('#btnPresent').setAttribute('aria-pressed', on);
  if (on) go(curIndex());
}
$('#btnPresent').addEventListener('click', () => setPresent(!document.body.classList.contains('present')));
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input,textarea')) return;
  const present = document.body.classList.contains('present');
  if ($('#ov').classList.contains('on')) return;
  if (e.key === 'p' || e.key === 'P') { setPresent(!present); return; }
  if (e.key === 'Escape' && present) { setPresent(false); return; }
  if (!present) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(curIndex() + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(curIndex() - 1); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const s = $('#arc'); if (curIndex() === PAGES.indexOf(s)) {
      e.preventDefault();
      const i = $$('.arc-seg').findIndex(b => b.getAttribute('aria-selected') === 'true');
      renderStage((i + (e.key === 'ArrowDown' ? 1 : 4)) % 5);
    }
  }
});

/* 导航高亮 + 页码 */
const navObs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  $$('#navLinks a, #rail a').forEach(a => a.classList.toggle('on', a.dataset.id === e.target.id));
  const i = PAGES.indexOf(e.target);
  $('#pagerTx').textContent = `${String(i).padStart(2, '0')} / ${String(PAGES.length - 1).padStart(2, '0')} ${e.target.dataset.title || '导读'}`;
}), { rootMargin: '-40% 0px -55% 0px' });
PAGES.forEach(p => navObs.observe(p));

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .05 });
$$('.reveal').forEach(el => io.observe(el));
</script>
</body>
