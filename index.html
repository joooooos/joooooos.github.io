/* v30 从滚动版飞回来：落地页背后是现在这个时间的天空（trip.js 画），文字放在一张奶油纸签上 */
#landing.out { opacity: 0; transform: scale(1.08); transition: opacity .8s cubic-bezier(.4,0,.2,1), transform .9s cubic-bezier(.4,0,.2,1); pointer-events: none; }

.ld-dot { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: var(--ink); animation: ldbob 1.6s ease-in-out infinite; }

.ld-k { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--ver); }
.ld-t { margin: 0; font: 400 clamp(36px, 5vw, 60px)/1.05 "Sucai Shehui", var(--sans); } .ld-t span { color: var(--cob); }

#pop { position: fixed; z-index: 24; left: 0; top: 0; width: 290px; background: var(--c, var(--paper)); border: 2.5px solid var(--ink); border-radius: 14px; padding: 14px 16px 14px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s; font-size: 14px; line-height: 1.6; }

/* v27 界面减法：所有浮层都缩到屏幕边缘，像电影字幕一样安静——不压住房间 */
#bub { left: 18px !important; bottom: 18px !important; max-width: min(440px, calc(50vw - 240px)); padding: 6px 14px 6px 34px; background: rgba(20,19,18,.86); color: #FFF8EE; border: 0; box-shadow: none; font: 400 15px/1.45 var(--hand); backdrop-filter: blur(6px); }

#tally:hover { opacity: 1; } #tally b { padding: 5px 10px; font-size: 10px; } #tally span { padding: 5px 9px; border-left-width: 1px; } #tally i { font-size: 12px; }

body.night #zones, body.night #tally { background: rgba(31,33,64,.7); border-color: rgba(245,237,228,.7); }
body.night #zones b, body.night #tally span, body.night #tally i { color: #F5EDE4; } body.night #zones span { color: rgba(245,237,228,.55); }
@media (max-width: 760px) { #bub { left: 8px !important; right: 8px; bottom: 64px !important; max-width: none; } #hint { display: none; } }

/* v28 从滚动版折纸飞机回来：落地页换成琥珀色桌面 + 一架纸飞机，接住那边的过场 */
html.byplane #landing { background: #F5EDE4; }
html.byplane .ld-now::before { content: "✈ "; }
/* v28 退卡提醒：插着卡带时，右下角一直挂着一个「退卡」——点它 / 按 B / Esc 都能回到屋里 */
#ejectTip { position: fixed; z-index: 12; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font: 700 13px/1.1 var(--sans); opacity: 0; translate: 0 16px; pointer-events: none; transition: opacity .25s, translate .3s cubic-bezier(.3,1.6,.5,1); }
body[data-view=play] #ejectTip, body[data-view=close] #ejectTip { opacity: 1; translate: 0 0; pointer-events: auto; }
body[data-view=play] #vpad, body[data-view=close] #vpad { bottom: 70px; }
#ejectTip .ej-k { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--cob); color: var(--paper); font-size: 14px; font-weight: 900; }
#ejectTip .ej-t { display: flex; flex-direction: column; gap: 1px; text-align: left; } #ejectTip .ej-t b { font-size: 14px; }
#ejectTip .ej-t { font-size: 11px; font-weight: 500; color: rgba(20,19,18,.6); } #ejectTip .ej-t b { color: var(--ink); font-weight: 900; }
#ejectTip .ej-or { font-size: 10px; font-weight: 500; color: rgba(20,19,18,.45); border-left: 1px dashed rgba(20,19,18,.25); padding-left: 10px; }
#ejectTip:hover { background: var(--cob); color: var(--paper); } #ejectTip:hover .ej-t, #ejectTip:hover .ej-t b, #ejectTip:hover .ej-or { color: var(--paper); } #ejectTip:hover .ej-k { background: var(--paper); color: var(--cob); }
#ejectTip.nudge { animation: ejNudge .7s cubic-bezier(.3,1.8,.5,1) 2; }
#ejectTip { transform-origin: 100% 100%; transition: opacity .25s, translate .3s cubic-bezier(.3,1.6,.5,1), transform .7s cubic-bezier(.3,1.3,.5,1); }
#ejectTip::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 3px solid var(--cob); opacity: 0; pointer-events: none; }
#ejectTip.hello { transform: translate(-24px, -18px) scale(1.35); } #ejectTip.hello::before { animation: ejRing 1.4s ease-out infinite; } #ejectTip.hello .ej-k { animation: ejBreath 1.4s ease-in-out infinite; }
@keyframes ejRing { 0% { opacity: .7; inset: -3px; } 100% { opacity: 0; inset: -16px; } }
@keyframes ejBreath { 50% { scale: 1.18; } }
#ejectTip { padding: 9px 18px 9px 9px; border-width: 2.5px; box-shadow: 4px 4px 0 var(--ink); } #ejectTip .ej-k { width: 36px; height: 36px; font-size: 16px; } #ejectTip .ej-t b { font-size: 16px; }
body[data-view=play] #ejectTip .ej-hand, body[data-view=close] body.ejdone @keyframes ejNudge { 30% { transform: translateX(-10px) rotate(-3deg); } 60% { transform: translateX(4px) rotate(1deg); } }
@media (max-width: 760px) { #ejectTip .ej-or { display: none; } }
@view-transition { navigation: auto; } ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
html.pl-arrive { background: var(--cream); } html.pl-arrive body > *:not(canvas) { visibility: hidden; }
/* v34 落地页开门：不再先变墨色再开黑洞——句号眨眼，奶油纸从句号这里开一个圆洞，屋子从洞里出来（一次，纸色） */
#ldIris { box-shadow: 0 0 0 200vmax var(--cream) !important; } #ldIris::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--ink); }
#landing.in .ld-dot { transform: scale(.2) !important; opacity: 0; transition: transform .3s cubic-bezier(.6,0,.4,1), opacity .25s .05s !important; }
/* v35 手机：顶部工牌不再压住「清单版」按钮；插卡时退卡按钮不压手柄和字幕 */
@media (max-width: 760px) {
  #tally { top: 58px !important; left: 10px; right: 10px; transform: none !important; justify-content: space-between; max-width: none; font-size: 10px; opacity: .9; }
  #tally span { padding: 4px 6px; white-space: nowrap; } #tally i { font-size: 11px; margin-left: 2px; }
  #soundBtn { top: 16px !important; left: auto !important; right: 176px; padding: 6px 10px; font-size: 12px; } #listBtn { padding: 6px 10px; font-size: 12px; }
  #ejectTip { right: 10px; bottom: 10px; padding: 6px 12px 6px 6px; } #ejectTip .ej-k { width: 28px; height: 28px; font-size: 13px; } #ejectTip .ej-t b { font-size: 13px; }
  #ejectTip.hello { transform: translate(-8px, -8px) scale(1.12); }
  body[data-view=play] #vpad, body[data-view=close] #vpad { bottom: 64px; right: 10px; transform: scale(.82); transform-origin: 100% 100%; }
  body[data-view=play] #bub, body[data-view=close] #bub { bottom: 64px !important; right: 190px; }
}
