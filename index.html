@font-face { font-family: "WenKai Book"; src: url(assets/hand.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Fira Code"; src: url(assets/fira-code-400.woff2) format("woff2"); font-display: swap; }
:root { --paper: #FFF8EE; --cream: #F5EDE4; --ink: #141312; --ver: #FF4D00; --cob: #2E4BFF; --amb: #E8A838; --lime: #CDFF00;
  --sans: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; --hand: "WenKai Book", "Kaiti SC", serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#gl { position: fixed; inset: 0; touch-action: none; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--cob); outline-offset: 3px; }
.chip { position: fixed; z-index: 10; border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
#who { left: 18px; top: 16px; display: flex; align-items: center; gap: 8px; box-shadow: none; border-color: transparent; background: none; cursor: default; padding-left: 0; }
#who b { font-size: 16px; }
#who b::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-left: 2px; }
#who span { font-weight: 500; color: rgba(20,19,18,.55); }
#soundBtn { right: 196px; top: 16px; }
#prog { display: none !important; }
body.night #hint, body.night #who b, body.night #who span { color: #F5EDE4 !important; text-shadow: 0 0 6px #2b221f !important; }
#hint { left: 22px !important; transform: none !important; }
#hint { background: rgba(255,248,238,.92); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; text-shadow: none !important; }
body.night #hint { background: rgba(52,38,32,.85); border-color: #F5EDE4; }
#listBtn { right: 18px; top: 16px; background: var(--cob); color: var(--paper); }
#prog { position: fixed; z-index: 10; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font-size: 12px; font-weight: 800; }
#prog i { width: 12px; height: 16px; border-radius: 3px 3px 2px 2px; border: 2px solid var(--c); background: transparent; opacity: .55; }
#prog i.on { opacity: 1; border-color: var(--ink); }
#prog i.on { background: var(--c); }
#prog span { margin-left: 4px; }
#hint { position: fixed; z-index: 10; left: 50%; bottom: 22px; transform: translateX(-50%); font: 400 20px/1.2 var(--hand); color: var(--ink); pointer-events: none; white-space: nowrap; text-shadow: 0 0 8px var(--cream), 0 0 3px var(--cream); }
#tip { position: fixed; z-index: 20; left: 0; top: 0; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; opacity: 0; transition: opacity .12s; white-space: nowrap; }
#tip.on { opacity: 1; }
#bub { position: fixed; z-index: 11; left: 0; top: 0; pointer-events: none; max-width: 300px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 14px; font: 400 18px/1.35 var(--hand); box-shadow: 3px 3px 0 var(--ink); opacity: 0; transition: opacity .2s; }
#bub::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px; background: var(--paper); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
#bub.on { opacity: 1; }
/* 屏幕手柄：触屏 / 不想用键盘的人 */
#vpad { position: fixed; z-index: 10; right: 18px; bottom: 16px; display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
body[data-view=play] #vpad, body[data-view=close] #vpad { opacity: 1; pointer-events: auto; }
.dp { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); }
.dp button, .ab button { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 8px; font-size: 13px; font-weight: 900; box-shadow: 2px 2px 0 var(--ink); padding: 0; }
.dp button:active, .ab button:active { transform: translate(2px, 2px); box-shadow: none; }
.dp [data-key=up] { grid-area: 1 / 2; } .dp [data-key=left] { grid-area: 2 / 1; } .dp [data-key=right] { grid-area: 2 / 3; } .dp [data-key=down] { grid-area: 3 / 2; }
.ab { display: flex; gap: 10px; }
.ab button { width: 52px; height: 52px; border-radius: 50%; font-size: 18px; }
.ab [data-key=a] { background: var(--ver); color: var(--paper); } .ab [data-key=b] { background: var(--cob); color: var(--paper); transform: translateY(14px); }
.ab [data-key=b]:active { transform: translate(2px, 16px); }
body[data-view=play] #hint, body[data-view=close] #hint { display: none; }
/* 开机前的门帘 */
#curtain { position: fixed; inset: 0; z-index: 40; background: var(--cream); display: grid; place-items: center; transition: opacity .7s .2s; pointer-events: none; }
#curtain b { font: 400 22px var(--hand); }
#curtain.plane, body.ready #curtain.plane { background: none; transition: none; opacity: 1; }

#tally:hover { opacity: 1; } #tally .tq i { color: var(--ver); } #tally .tq.won { background: var(--lime); color: var(--ink); } #tally b { padding: 5px 10px; font-size: 10px; } #tally span { padding: 5px 9px; border-left-width: 1px; } #tally i { font-size: 12px; }

@media (max-width: 760px) { #bub { left: 8px !important; right: 8px; bottom: 64px !important; max-width: none; } #hint { display: none; } }

/* v28 从滚动版折纸飞机回来：落地页换成琥珀色桌面 + 一架纸飞机，接住那边的过场 */
html.byplane #landing { background: #F5EDE4; }
html.byplane .ld-now::before { content: "✈ "; }
/* v28 退卡提醒：插着卡带时，右下角一直挂着一个「退卡」——点它 / 按 B / Esc 都能回到屋里 */
#ejectTip { position: fixed; z-index: 12; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font: 700 13px/1.1 var(--sans); opacity: 0; translate: 0 16px; pointer-events: none; transition: opacity .25s, translate .3s cubic-bezier(.3,1.6,.5,1); }
body[data-view=play] #ejectTip, body[data-view=close] #ejectTip { opacity: 1; translate: 0 0; pointer-events: auto; }
body[data-view=play] #vpad, body[data-view=close] #vpad { bottom: 70px; }
#ejectTip .ej-k { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--cob); color: var(--paper); font-size: 14px; font-weight: 900; }
#ejectTip .ej-t { display: flex; flex-direction: column; gap: 1px; text-align: left; } #ejectTip .ej-t b { font-size: 14px; }
#ejectTip .ej-t { font-size: 11px; font-weight: 500; color: rgba(20,19,18,.6); } #ejectTip .ej-t b { color: var(--ink); font-weight: 900; }
#ejectTip .ej-or { font-size: 10px; font-weight: 500; color: rgba(20,19,18,.45); border-left: 1px dashed rgba(20,19,18,.25); padding-left: 10px; }
#ejectTip:hover { background: var(--cob); color: var(--paper); } #ejectTip:hover .ej-t, #ejectTip:hover .ej-t b, #ejectTip:hover .ej-or { color: var(--paper); } #ejectTip:hover .ej-k { background: var(--paper); color: var(--cob); }
#ejectTip.nudge { animation: ejNudge .7s cubic-bezier(.3,1.8,.5,1) 2; }
#ejectTip { transform-origin: 100% 100%; transition: opacity .25s, translate .3s cubic-bezier(.3,1.6,.5,1), transform .7s cubic-bezier(.3,1.3,.5,1); }
#ejectTip::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 3px solid var(--cob); opacity: 0; pointer-events: none; }
#ejectTip.hello { transform: translate(-24px, -18px) scale(1.35); } #ejectTip.hello::before { animation: ejRing 1.4s ease-out infinite; } #ejectTip.hello .ej-k { animation: ejBreath 1.4s ease-in-out infinite; }
@keyframes ejRing { 0% { opacity: .7; inset: -3px; } 100% { opacity: 0; inset: -16px; } }
@keyframes ejBreath { 50% { scale: 1.18; } }
#ejectTip { padding: 9px 18px 9px 9px; border-width: 2.5px; box-shadow: 4px 4px 0 var(--ink); } #ejectTip .ej-k { width: 36px; height: 36px; font-size: 16px; } #ejectTip .ej-t b { font-size: 16px; }
body[data-view=play] #ejectTip .ej-hand, body[data-view=close] body.ejdone @keyframes ejNudge { 30% { transform: translateX(-10px) rotate(-3deg); } 60% { transform: translateX(4px) rotate(1deg); } }
@media (max-width: 760px) { #ejectTip .ej-or { display: none; } }
@view-transition { navigation: auto; } ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
html.pl-arrive { background: var(--cream); } html.pl-arrive body > *:not(canvas) { visibility: hidden; }
/* v34 落地页开门：不再先变墨色再开黑洞——句号眨眼，奶油纸从句号这里开一个圆洞，屋子从洞里出来（一次，纸色） */
#ldIris { box-shadow: 0 0 0 200vmax var(--cream) !important; } #ldIris::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--ink); }
#landing.in .ld-dot { transform: scale(.2) !important; opacity: 0; transition: transform .3s cubic-bezier(.6,0,.4,1), opacity .25s .05s !important; }
/* v35 手机：顶部工牌不再压住「清单版」按钮；插卡时退卡按钮不压手柄和字幕 */
@media (max-width: 760px) {
  #tally { top: 58px !important; left: 10px; right: 10px; transform: none !important; justify-content: space-between; max-width: none; font-size: 10px; opacity: .9; }
  #tally span { padding: 4px 6px; white-space: nowrap; } #tally i { font-size: 11px; margin-left: 2px; }
  #soundBtn { top: 16px !important; left: auto !important; right: 176px; padding: 6px 10px; font-size: 12px; } #listBtn { padding: 6px 10px; font-size: 12px; }
  #ejectTip { right: 10px; bottom: 10px; padding: 6px 12px 6px 6px; } #ejectTip .ej-k { width: 28px; height: 28px; font-size: 13px; } #ejectTip .ej-t b { font-size: 13px; }
  #ejectTip.hello { transform: translate(-8px, -8px) scale(1.12); }
  body[data-view=play] #vpad, body[data-view=close] #vpad { bottom: 64px; right: 10px; transform: scale(.82); transform-origin: 100% 100%; }
  body[data-view=play] #bub, body[data-view=close] #bub { bottom: 64px !important; right: 190px; }
}
@media (max-width: 760px) { body[data-view=room] #bub { bottom: 112px !important; } }

<body data-view="room">

  <div class="ld-in">

<script>/* v36 进度从第一个字节就开始走：边下载 bundle.js 边推进度环（0 → 34%），下完再执行；file:// 或不支持流式时退回普通 <script> */
(function () {
  var fg = document.querySelector("#landing .fg"), now = document.querySelector("#landing .ld-now"), raf = 0, want = 0, shown = 0;
  function paint() { shown += (want - shown) * 0.18; if (fg) { fg.style.strokeDashoffset = (377 * (1 - shown)).toFixed(1); fg.classList.toggle("z", shown < 0.02); } window.__ld0 = shown; raf = requestAnimationFrame(paint); }
  window.__ldStop = function () { cancelAnimationFrame(raf); };
  function plain() { var t = document.createElement("script"); t.src = "bundle.js"; document.body.appendChild(t); }
  if (location.protocol === "file:" || !window.fetch || !window.ReadableStream) return plain();
  raf = requestAnimationFrame(paint);
  fetch("bundle.js", { credentials: "same-origin", mode: "cors" }).then(function (r) {
    if (!r.ok || !r.body) throw 0;
    var total = +r.headers.get("content-length") || 1460000, enc = r.headers.get("content-encoding"), got = 0, rd = r.body.getReader(), parts = [];
    if (enc) total = total * 2.6; /* gzip 过的：content-length 是压缩后大小，按解压后估算 */
    function pump() { return rd.read().then(function (x) { if (x.done) return; parts.push(x.value); got += x.value.length; want = Math.min(0.34, (got / total) * 0.34); if (now) now.textContent = "正在开灯…… " + Math.min(99, Math.round((got / total) * 100)) + "%"; return pump(); }); }
    return pump().then(function () { want = 0.34; var url = URL.createObjectURL(new Blob(parts, { type: "text/javascript" })), t = document.createElement("script"); t.src = url; t.onload = function () { URL.revokeObjectURL(url); }; document.body.appendChild(t); });
  }).catch(plain);
})();</script>
